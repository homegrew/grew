name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - '*'

permissions:
  contents: write
  # packages: write
  # issues: write

jobs:
  goreleaser:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Installer Package and DMG
        run: |
          tar xzf dist/grew_Darwin_all.tar.gz grew
          chmod 755 grew
          ./tools/build-installer.sh \
            --binary "$(pwd)/grew" \
            --version "${{ github.ref_name }}" \
            --output-dir dist
          rm -f grew

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Homegrew.dmg

      - name: Install bsdiff
        run: brew install bsdiff
      - name: Generate Binary Patches
        id: patcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the previous semantic version tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Skipping patch generation."
            exit 0
          fi

          # Require the previous release to already have the universal binary archive.
          # Releases predating the universal-binary migration only have per-arch archives
          # (grew_Darwin_arm64.tar.gz / grew_Darwin_x86_64.tar.gz); patching from those
          # to the new format is a one-time gap we skip rather than fail.
          if ! gh release view "$PREV_TAG" --json assets --jq '.assets[].name' | grep -q 'grew_Darwin_all.tar.gz'; then
            echo "Previous release $PREV_TAG lacks grew_Darwin_all.tar.gz (pre-universal). Skipping patch generation."
            exit 0
          fi

          echo "Generating patches from $PREV_TAG to ${{ github.ref_name }}"
          mkdir -p dist-patches

          # Allow some time for GoReleaser assets to be fully available via the API
          sleep 10

          go run tools/patcher/main.go -v -D dist-patches/ "$PREV_TAG" "${{ github.ref_name }}"
          echo "patches_generated=true" >> $GITHUB_OUTPUT

      - name: Upload Patches to Release
        if: steps.patcher.outputs.patches_generated == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist-patches/*
