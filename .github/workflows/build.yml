# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go generate ./...
      - run: go build -v ./...
      - run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Install sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap patchelf

      - name: Build with devmode
        run: |
          go build -v -tags devmode -o grew .
          ./grew --version

      - name: Setup (User-local)
        run: |
          ./grew setup --unsafe
          cp grew "$HOME/.homegrew/bin/grew"
          echo "$HOME/.homegrew/bin" >> $GITHUB_PATH

      - name: Update
        run: which grew && grew update

      - name: Install nano
        run: which grew && grew install -v -d nano && which nano && nano -V

