# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read
  pull-requests: write
on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: mkdir -p coverageFiles coverageRaw
      - name: Run unit tests with coverage
        run: |
          go list ./... | grep -v /tests > unit_pkgs.txt
          go test -tags devmode -race -coverprofile=./coverageFiles/coverage_unit.txt -covermode=atomic $(cat unit_pkgs.txt)
      - name: Run integration tests with coverage
        run: |
          GOCOVERDIR=$GITHUB_WORKSPACE/coverageRaw go test -tags "devmode,integration" -cover -coverpkg=./... -count=1 ./tests/...
          go tool covdata textfmt -i=$GITHUB_WORKSPACE/coverageRaw -o ./coverageFiles/coverage_integration.txt
      - uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: 'false'
          handle_no_reports_found: 'true'
          skip_validation: 'true'
          directory: ./coverageFiles
          token: ${{ secrets.CODECOV_TOKEN }}
