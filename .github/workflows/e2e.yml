name: Live E2E Tests
on:
  schedule:
    - cron: '0 0 * * *' # Run daily
  workflow_dispatch:      # Allow manual triggers
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      
      - name: Run TestLiveEndToEnd
        run: go test -v -timeout 15m -tags devmode,integration ./tests -run TestLiveEndToEnd
