name: Live E2E Tests
on:
  schedule:
    - cron: '0 0 * * *' # Run daily
  workflow_dispatch:      # Allow manual triggers
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      
      - run: mkdir -p coverageFiles coverageRaw
      - name: Run TestLiveEndToEnd
        run: |
          GOCOVERDIR=$GITHUB_WORKSPACE/coverageRaw go test -v -timeout 15m -tags devmode,e2e -cover -coverpkg=./... ./tests -run TestLiveEndToEnd
          go tool covdata textfmt -i=$GITHUB_WORKSPACE/coverageRaw -o ./coverageFiles/coverage_e2e.txt

#      - uses: codecov/codecov-action@v6
#        with:
#          fail_ci_if_error: false
#          directory: ./coverageFiles
#          token: ${{ secrets.CODECOV_TOKEN }}
