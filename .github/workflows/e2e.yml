name: Live E2E Tests
on:
  schedule:
    - cron: '0 0 * * *' # Run daily
  workflow_dispatch:      # Allow manual triggers
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap patchelf
      
      - name: Run TestLiveEndToEnd
        run: go test -v -timeout 15m -tags devmode,integration ./tests -run TestLiveEndToEnd
