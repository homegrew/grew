name: E2E Test
on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build with devmode
        run: go build -v -tags devmode -o grew .

      - name: Setup (User-local)
        run: |
          ./grew setup --unsafe
          cp grew "$HOME/.homegrew/bin/grew"
          echo "$HOME/.homegrew/bin" >> $GITHUB_PATH

      - name: Update
        run: grew update

      - name: Install nano
        run: grew install -v -d nano && nano -V || echo OK
